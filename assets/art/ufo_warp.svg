<svg xmlns="http://www.w3.org/2000/svg" width="252" height="66" viewBox="-126 -34 252 66">
  <!-- The warp UFO: same shape as ufo.svg in purple, with an orange alien.
       (0,0) is the center of the saucer disc. The top of the glass dome is at y=-28 (the bunny lands there). -->
  <defs>
    <clipPath id="disc"><ellipse cx="0" cy="8" rx="120" ry="14"/></clipPath>
    <clipPath id="hub"><ellipse cx="0" cy="21" rx="34" ry="6"/></clipPath>
    <clipPath id="collar"><ellipse cx="0" cy="0" rx="42" ry="6.5"/></clipPath>
    <clipPath id="dome"><path d="M-35,-2 C-35,-19 -19,-28 0,-28 C19,-28 35,-19 35,-2 A35,4 0 0 1 -35,-2 Z"/></clipPath>
    <clipPath id="head"><circle cx="0" cy="-11" r="10"/></clipPath>
  </defs>
  <!-- Small hub under the saucer -->
  <ellipse cx="0" cy="21" rx="34" ry="6" fill="#57468f"/>
  <g clip-path="url(#hub)">
    <rect x="-40" y="24" width="80" height="4" fill="#000" opacity="0.12"/>
  </g>
  <!-- Saucer disc: dark underside, silver top, light rim lip -->
  <ellipse cx="0" cy="8" rx="120" ry="14" fill="#6b54b8"/>
  <g clip-path="url(#disc)">
    <ellipse cx="0" cy="4" rx="126" ry="12" fill="#dccdff"/>
    <ellipse cx="0" cy="2.5" rx="126" ry="11.5" fill="#a98cf0"/>
    <path d="M-115,5 Q-104,-3 -44,-6 Q-96,-1.5 -115,5 Z" fill="#fff" opacity="0.6"/>
    <path d="M115,5 Q104,-3 54,-6 Q100,-1.5 115,5 Z" fill="#fff" opacity="0.3"/>
    <ellipse cx="0" cy="25" rx="112" ry="7" fill="#000" opacity="0.12"/>
  </g>
  <!-- Rim lights -->
  <circle cx="-90" cy="14.6" r="4" fill="#4fe3ff"/>
  <circle cx="-60" cy="17.2" r="4" fill="#ff7ad9"/>
  <circle cx="-30" cy="18.6" r="4" fill="#b9f6ff"/>
  <circle cx="0" cy="19" r="4" fill="#4fe3ff"/>
  <circle cx="30" cy="18.6" r="4" fill="#b9f6ff"/>
  <circle cx="60" cy="17.2" r="4" fill="#ff7ad9"/>
  <circle cx="90" cy="14.6" r="4" fill="#4fe3ff"/>
  <g fill="#fff" opacity="0.75">
    <circle cx="-91.3" cy="13.3" r="1.3"/>
    <circle cx="-61.3" cy="15.9" r="1.3"/>
    <circle cx="-31.3" cy="17.3" r="1.3"/>
    <circle cx="-1.3" cy="17.7" r="1.3"/>
    <circle cx="28.7" cy="17.3" r="1.3"/>
    <circle cx="58.7" cy="15.9" r="1.3"/>
    <circle cx="88.7" cy="13.3" r="1.3"/>
  </g>
  <!-- Dome collar: a raised metal ring the dome sits in -->
  <ellipse cx="0" cy="0" rx="42" ry="6.5" fill="#7f68c9"/>
  <g clip-path="url(#collar)">
    <ellipse cx="0" cy="-2" rx="40" ry="4.8" fill="#cfc0ff"/>
    <rect x="-44" y="4" width="88" height="4" fill="#000" opacity="0.1"/>
  </g>
  <!-- Glass dome (back) -->
  <path d="M-35,-2 C-35,-19 -19,-28 0,-28 C19,-28 35,-19 35,-2 A35,4 0 0 1 -35,-2 Z" fill="#bfe9ff" opacity="0.7"/>
  <!-- Little orange alien -->
  <g clip-path="url(#dome)">
    <ellipse cx="0" cy="2" rx="12" ry="7" fill="#e8873a"/>
    <path d="M-3.4,-18 L-7.3,-23.4 M3.4,-18 L7.3,-23.4" stroke="#d9762b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="-7.3" cy="-23.6" r="2.1" fill="#4fe3ff"/>
    <circle cx="7.3" cy="-23.6" r="2.1" fill="#4fe3ff"/>
    <circle cx="-7.9" cy="-24.3" r="0.7" fill="#fff" opacity="0.7"/>
    <circle cx="6.7" cy="-24.3" r="0.7" fill="#fff" opacity="0.7"/>
    <circle cx="0" cy="-11" r="10" fill="#f7a94f"/>
    <g clip-path="url(#head)">
      <rect x="-12" y="-5" width="24" height="6" fill="#000" opacity="0.1"/>
    </g>
    <ellipse cx="-7" cy="-7.4" rx="1.9" ry="1.3" fill="#ff9fb9" opacity="0.9"/>
    <ellipse cx="7" cy="-7.4" rx="1.9" ry="1.3" fill="#ff9fb9" opacity="0.9"/>
    <ellipse cx="-4.2" cy="-12" rx="3.1" ry="4" fill="#1f2a24"/>
    <ellipse cx="4.2" cy="-12" rx="3.1" ry="4" fill="#1f2a24"/>
    <circle cx="-3.2" cy="-13.6" r="1.2" fill="#fff"/>
    <circle cx="5.2" cy="-13.6" r="1.2" fill="#fff"/>
    <path d="M-2.2,-6.5 Q0,-4.8 2.2,-6.5" stroke="#8a4a1a" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Glass dome (front sheen and highlight) -->
  <path d="M-35,-2 C-35,-19 -19,-28 0,-28 C19,-28 35,-19 35,-2 A35,4 0 0 1 -35,-2 Z" fill="#bfe9ff" opacity="0.12"/>
  <path d="M-26,-7 Q-25,-20 -11,-24" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="-27" cy="-2.5" r="1.6" fill="#fff" opacity="0.85"/>
  <path d="M27,-14 Q24,-19 19,-22" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.45"/>
</svg>
