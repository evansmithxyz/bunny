    <clipPath id="tile"><rect x="-27.224" y="-27.224" width="54.447" height="54.447" rx="8" transform="translate(35 35) rotate(45)"/></clipPath>
  </defs>
  <rect x="-27.224" y="-27.224" width="54.447" height="54.447" rx="8" transform="translate(35 35) rotate(45)" fill="#58b8f0"/>
  <g clip-path="url(#tile)">
    <rect x="-27.224" y="-27.224" width="54.447" height="54.447" rx="8" transform="translate(35 38.75) rotate(45)" fill="#399dd7"/>
  </g>
  <!-- Hourglass glyph: two glass triangles meeting at a narrow neck, with flat end caps -->
  <path d="M27.5,24.5 L42.5,24.5 L36.3,34.6 L36.3,36.4 L42.5,46.5 L27.5,46.5 L33.7,36.4 L33.7,34.6 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
