<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="-150 -130 320 200">
  <defs>
    <clipPath id="body"><ellipse cx="0" cy="4" rx="100" ry="34"/></clipPath>
  </defs>
  <!-- Tail -->
  <path d="M-84,-6 L-142,-26 L-130,6 L-84,16 Z" fill="#dcdcd4"/>
  <!-- Long neck (drawn behind the body) -->
  <path d="M60,-4 Q98,-42 112,-84" stroke="#f4f4f0" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M84,-10 Q106,-44 118,-80" stroke="#e2e2da" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="0" cy="4" rx="100" ry="34" fill="#f4f4f0"/>
  <g clip-path="url(#body)">
    <rect x="-110" y="20" width="220" height="24" fill="#000" opacity="0.08"/>
  </g>
  <!-- Head -->
  <ellipse cx="118" cy="-90" rx="25" ry="21" fill="#f4f4f0"/>
  <!-- Eye -->
  <circle cx="124" cy="-96" r="5.5" fill="#2b2b2b"/>
  <circle cx="125.5" cy="-97.5" r="1.8" fill="#fff"/>
  <!-- Orange beak with knob -->
  <path d="M137,-98 L168,-86 L138,-76 Z" fill="#f39c34"/>
  <path d="M138,-86 L168,-86 L138,-76 Z" fill="#e0822a"/>
  <circle cx="139" cy="-96" r="6.5" fill="#e67e22"/>
</svg>
