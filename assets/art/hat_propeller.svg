    <clipPath id="bladeL"><path d="M51,12 C42,7 22,4 11,6 C4,7.5 3,17 10,18.5 C22,21 42,18 51,15 Z"/></clipPath>
    <clipPath id="bladeR"><path d="M59,12 C68,7 88,4 99,6 C106,7.5 107,17 100,18.5 C88,21 68,18 59,15 Z"/></clipPath>
    <clipPath id="visor"><path d="M23,94.1 C29,107.2 81,107.2 87,94.1 Q55,97.9 23,94.1 Z"/></clipPath>
  </defs>
  <!-- Stem -->
  <rect x="52" y="12" width="6" height="28" rx="2" fill="#5b5f6b"/>
  <rect x="52" y="12" width="2.5" height="28" rx="1.2" fill="#7c8190"/>
  <!-- Cap dome: blue sides, green / yellow / red front panels -->
  <path d="M9,92 A46,54 0 0 1 101,92 Q55,100 9,92 Z" fill="#3b9bd6"/>
  <g clip-path="url(#dome)">
    <path d="M55,38 A42.5,54 0 0 0 12.5,92 L12.5,104 L55,104 Z" fill="#2ecc71"/>
    <path d="M55,38 A42.5,54 0 0 1 97.5,92 L97.5,104 L55,104 Z" fill="#e74c3c"/>
    <path d="M37.4,92 A17.6,54 0 0 1 72.6,92 L72.6,104 L37.4,104 Z" fill="#f7d046"/>
