  <path d="M51,12 C42,7 22,4 11,6 C4,7.5 3,17 10,18.5 C22,21 42,18 51,15 Z" fill="#e74c3c"/>
  <g clip-path="url(#bladeL)">
    <rect x="0" y="14" width="56" height="10" fill="#000" opacity="0.15"/>
    <path d="M44,10.3 C34,7.3 20,6.8 13,8.3" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45"/>
  </g>
  <path d="M59,12 C68,7 88,4 99,6 C106,7.5 107,17 100,18.5 C88,21 68,18 59,15 Z" fill="#f39c34"/>
  <g clip-path="url(#bladeR)">
