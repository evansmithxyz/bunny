    <ellipse cx="34" cy="57" rx="6" ry="12" fill="#fff" opacity="0.3" transform="rotate(35 34 57)"/>
  </g>
  <!-- Visor -->
  <path d="M23,94.1 C29,107.2 81,107.2 87,94.1 Q55,97.9 23,94.1 Z" fill="#2f86c2"/>
  <g clip-path="url(#visor)">
