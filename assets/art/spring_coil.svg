<svg xmlns="http://www.w3.org/2000/svg" width="40" height="44" viewBox="0 0 40 44">
  <!-- Hangs down from the foot: top plate's top edge at y=0, centered on x=20. -->
  <defs>
    <clipPath id="top"><rect x="3" y="0" width="34" height="8" rx="3"/></clipPath>
    <clipPath id="foot"><rect x="5" y="37" width="30" height="7" rx="3"/></clipPath>
  </defs>
  <!-- Coil: back strands (darker, behind) -->
  <g fill="none" stroke="#757e90" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30,6 Q20,6.85 10,10.7"/>
    <path d="M30,15.4 Q20,15.25 10,20.1"/>
    <path d="M30,24.8 Q20,24.65 10,29.5"/>
    <path d="M30,34.2 Q20,34.05 10,38.9"/>
  </g>
  <!-- Coil: front strands (darker underside, then the lit wire shifted up) -->
  <g fill="none" stroke="#8690a3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10,10.7 Q20,16.05 30,15.4"/>
    <path d="M10,20.1 Q20,25.45 30,24.8"/>
    <path d="M10,29.5 Q20,34.85 30,34.2"/>
  </g>
  <g fill="none" stroke="#9aa3b5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-0.8)">
    <path d="M10,10.7 Q20,16.05 30,15.4"/>
    <path d="M10,20.1 Q20,25.45 30,24.8"/>
    <path d="M10,29.5 Q20,34.85 30,34.2"/>
  </g>
  <!-- Coil: highlights on the front strands -->
  <g fill="none" stroke="#c4cad6" stroke-width="1.8" stroke-linecap="round">
    <path d="M12.5,10.6 Q18,13.4 23,13.6"/>
    <path d="M12.5,20 Q18,22.8 23,23"/>
    <path d="M12.5,29.4 Q18,32.2 23,32.4"/>
  </g>
  <!-- Top plate (attaches to the foot) -->
  <rect x="3" y="0" width="34" height="8" rx="3" fill="#f39c34"/>
  <g clip-path="url(#top)">
    <rect x="0" y="5.6" width="40" height="3" fill="#c2721b"/>
  </g>
  <rect x="6" y="1.5" width="14" height="1.8" rx="0.9" fill="#fff" opacity="0.35"/>
  <!-- Bottom foot plate -->
  <rect x="5" y="37" width="30" height="7" rx="3" fill="#67757f"/>
  <g clip-path="url(#foot)">
    <rect x="0" y="41.5" width="40" height="3" fill="#000" opacity="0.15"/>
  </g>
  <rect x="8" y="38.2" width="12" height="1.4" rx="0.7" fill="#fff" opacity="0.18"/>
</svg>
